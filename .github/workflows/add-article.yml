name: Add article from issue

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  add-article:
    if: contains(github.event.issue.labels.*.name, 'add-article')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Parse issue form body
        id: parse
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          python3 - <<'PYEOF' >> "$GITHUB_OUTPUT"
          import os
          import re

          body = os.environ.get("BODY", "")

          def section_value(label, text):
              pattern = r"### " + re.escape(label) + r"\s*\n+(.*?)(?=\n### |\Z)"
              m = re.search(pattern, text, re.DOTALL)
              if not m:
                  return ""
              val = m.group(1).strip()
              if val == "_No response_":
                  return ""
              return val

          ident = section_value("DOI, PMID, or URL", body)
          section = section_value("Section", body)
          take = section_value("One-line take", body)

          def emit(name, value):
              value = value.replace("\r\n", "\n")
              delim = "GHA_EOF_DELIM"
              print(f"{name}<<{delim}")
              print(value)
              print(delim)

          emit("identifier", ident)
          emit("section", section)
          emit("take", take)
          PYEOF

      - name: Create or update branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="add/issue-${{ github.event.issue.number }}"
          git fetch origin "$BRANCH" 2>/dev/null || true
          if git rev-parse --verify "origin/$BRANCH" >/dev/null 2>&1; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
            git merge --no-edit origin/main || git reset --hard origin/main
          else
            git checkout -B "$BRANCH" origin/main
          fi
          echo "branch=$BRANCH" >> "$GITHUB_ENV"

      - name: Resolve and add record
        id: add
        env:
          IDENT: ${{ steps.parse.outputs.identifier }}
          SECTION: ${{ steps.parse.outputs.section }}
          TAKE: ${{ steps.parse.outputs.take }}
        run: |
          set +e
          if [ -n "$TAKE" ]; then
            python3 scripts/add_doi.py "$IDENT" --section "$SECTION" --take "$TAKE" > /tmp/add_output.json
          else
            python3 scripts/add_doi.py "$IDENT" --section "$SECTION" > /tmp/add_output.json
          fi
          STATUS=$?
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          set -e

      - name: Comment on failure
        if: steps.add.outputs.status != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const ident = process.env.IDENT;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Could not resolve \`${ident}\` against Crossref/PubMed — check the identifier and edit the issue.`,
            });
        env:
          IDENT: ${{ steps.parse.outputs.identifier }}

      - name: Stop here on failure
        if: steps.add.outputs.status != '0'
        run: exit 0

      - name: Build and validate
        if: steps.add.outputs.status == '0'
        run: |
          python3 scripts/build.py
          python3 scripts/validate.py

      - name: Commit changes
        if: steps.add.outputs.status == '0'
        id: commit
        run: |
          TITLE=$(python3 -c "import json; d=json.load(open('/tmp/add_output.json')); print((d.get('title') or '').strip())" 2>/dev/null || echo "")
          if [ -z "$TITLE" ]; then
            TITLE="new article"
          fi
          SHORT_TITLE=$(python3 -c "import sys; t=sys.argv[1]; print(t[:60])" "$TITLE")
          MSG="add: ${SHORT_TITLE} (closes #${{ github.event.issue.number }})"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit" >&2
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "$MSG"
            git push --force-with-lease origin "HEAD:$branch"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "title=$MSG" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        if: steps.add.outputs.status == '0' && steps.commit.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RECORD_JSON=$(cat /tmp/add_output.json)
          BODY=$(printf 'Closes #%s\n\n```json\n%s\n```\n' "${{ github.event.issue.number }}" "$RECORD_JSON")
          EXISTING_PR=$(gh pr list --head "$branch" --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" --title "${{ steps.commit.outputs.title }}" --body "$BODY"
          else
            gh pr create --title "${{ steps.commit.outputs.title }}" --body "$BODY" --head "$branch" --base main
          fi
