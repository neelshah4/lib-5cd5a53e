<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reading Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap">
<link rel="stylesheet" href="styles.css?v=11">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="topbar">
  <div class="topbar-inner">
    <a class="wordmark" href="#/library">Reading Library</a>

    <nav class="segmented" aria-label="View">
      <a href="#/library" data-nav="library" class="seg">Library</a>
      <a href="#/archive" data-nav="archive" class="seg">Archive</a>
    </nav>

    <div class="search-wrap">
      <label class="vh" for="q">Search papers</label>
      <input id="q" type="search" autocomplete="off" spellcheck="false"
             placeholder="Search title, author, journal, DOI  ( / )">
    </div>

    <div class="topbar-tools">
      <label class="switch-row" for="abstracts">
        <input id="abstracts" type="checkbox" class="switch">
        <span>Include abstracts</span>
      </label>
      <button id="theme-toggle" type="button" class="icon-btn" aria-label="Switch colour theme">
        <span id="theme-glyph" aria-hidden="true">Dark</span>
      </button>
    </div>
  </div>
  <div class="topbar-status">
    <span id="count" class="count" role="status" aria-live="polite">Loading library…</span>
    <span id="abstract-note" class="abstract-note" hidden></span>
  </div>
</header>

<main id="main">

  <!-- ── Library ───────────────────────────────────────────── -->
  <section id="view-library" class="view">
    <button id="filters-open" type="button" class="filters-btn" aria-expanded="false" aria-controls="rail">
      Filters <span id="filters-badge" class="filters-badge" hidden></span>
    </button>

    <div class="rail-scrim" id="rail-scrim" hidden></div>

    <aside id="rail" class="rail" aria-label="Filters">
      <div class="rail-head">
        <span class="label">Filters</span>
        <button id="rail-close" type="button" class="icon-btn rail-close" aria-label="Close filters">Close</button>
      </div>
      <div id="facets"></div>
    </aside>

    <div class="results">
      <div id="chips" class="chips" aria-label="Active filters"></div>
      <div id="table-wrap" class="table-wrap">
        <table id="table">
          <caption class="vh">Critical care reading library — papers matching the current filters</caption>
          <thead>
            <tr>
              <th scope="col" class="col-title"   data-sort="title"><button type="button">Title</button></th>
              <th scope="col" class="col-journal" data-sort="journal"><button type="button">Journal</button></th>
              <th scope="col" class="col-year num" data-sort="year"><button type="button">Year</button></th>
              <th scope="col" class="col-section">Section</th>
              <th scope="col" class="col-posted" data-sort="posted"><button type="button">Posted</button></th>
              <th scope="col" class="col-links"><span class="vh">Links</span></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <div id="sentinel" class="sentinel" aria-hidden="true"></div>
        <p id="empty" class="empty" hidden></p>
      </div>
    </div>
  </section>

  <!-- ── Archive ───────────────────────────────────────────── -->
  <section id="view-archive" class="view" hidden>
    <div class="archive-grid">
      <div id="archive-body" class="archive-body"></div>
      <nav id="archive-nav" class="archive-nav" aria-label="Digest timeline"></nav>
    </div>
  </section>

</main>

<footer class="footer">
  <span id="foot-count">—</span>
  <span id="foot-updated">—</span>
  <span>Metadata only — no PDFs or full text are stored here.</span>
</footer>

<script src="vendor/minisearch.min.js"></script>
<script src="app.js?v=9"></script>
</body>
</html>
